name: leaderboard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/fixtures.mjs
      - run: node verify-r10.mjs
      - run: node leaderboard.mjs --check
